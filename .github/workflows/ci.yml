name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  CARGO_INCREMENTAL: "0"

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Pinned to match rust-toolchain.toml so CI and local never drift.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - uses: mozilla-actions/sccache-action@v0.0.10

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      # Produces dist/, which the Tauri crate's generate_context! embeds (needed
      # before clippy compiles the presentation crate).
      - name: Build frontend
        run: npm run build

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # Debug compile of the real app — not installer packaging. Packaging,
      # signing, and updater artifacts belong to the tag-driven release.yml.
      - name: Tauri debug build
        run: npx tauri build --debug --no-bundle

  # WattMail ships Windows-first, but the codebase is cross-platform. This job
  # compiles the macOS/Linux code paths — the `cfg(not(windows))` branches and
  # the apple-native / sync-secret-service keyring backends — so platform gating
  # can't silently rot behind the Windows-only release build above. Clippy, not a
  # full bundle: it exercises the gates without the cost/system-deps of packaging.
  cross-check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - uses: mozilla-actions/sccache-action@v0.0.10

      - uses: Swatinem/rust-cache@v2

      # Tauri's Linux build needs the system webkit/gtk/appindicator libraries to
      # compile; macOS needs none.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libsoup-3.0-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      # generate_context! embeds dist/, so it must exist before clippy compiles
      # the presentation crate.
      - name: Build frontend
        run: npm run build

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
