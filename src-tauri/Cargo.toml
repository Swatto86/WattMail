[package]
name = "wattmail-desktop"
version = "0.14.5"
description = "WattMail desktop client"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "wattmail_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
dirs = "6"
wattmail-domain = { workspace = true }
wattmail-application = { workspace = true }
wattmail-infrastructure = { workspace = true }

# Linux tray: Tauri's tray-icon click events are unsupported on Linux
# (libappindicator limitation), so on Linux we register a StatusNotifierItem
# directly via ksni to get real left-click-to-open on Wayland bars (waybar on
# Omarchy/Hyprland). png decodes the bundled tray icons into ARGB32 pixmaps.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }
png = "0.17"
# Called directly on a std::thread. The notification plugin's show() spawns
# onto Tokio, where notify-rust's zbus::block_on aborts the process.
notify-rust = "4.18"

[dev-dependencies]
tokio = { workspace = true }
